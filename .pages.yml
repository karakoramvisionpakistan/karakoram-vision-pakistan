media:
  input: src/assets/uploads
  output: /assets/uploads
settings:
  content:
    merge: true
  commit:
    templates:
      create: Create {path} via Karakoram Vision Pakistan CMS
      update: Update {path} via Karakoram Vision Pakistan CMS
      delete: Delete {path} via Karakoram Vision Pakistan CMS
      rename: Rename {oldPath} to {newPath} via Karakoram Vision Pakistan CMS
    identity: app
components:
  seo:
    type: object
    label: SEO, GEO, AEO & Social
    fields:
      - name: title
        label: SEO title
        type: string
      - name: description
        label: Meta description
        type: text
      - name: keywords
        label: Keywords
        type: string
      - name: robots
        label: Robots
        type: string
        description: "Example: index, follow, max-image-preview:large"
      - name: canonical
        label: Custom canonical
        type: string
      - name: social_image
        label: Social/OG image
        type: image
  faqs:
    type: object
    label: Frequently asked questions
    list: true
    fields:
      - name: question
        label: Question
        type: string
        required: true
      - name: answer
        label: Answer
        type: rich-text
        required: true
  sources:
    type: object
    label: Sources and references
    list: true
    fields:
      - name: label
        label: Source label
        type: string
      - name: url
        label: Source URL
        type: string
  key_facts:
    type: object
    label: Key facts
    list: true
    fields:
      - name: label
        label: Label
        type: string
      - name: value
        label: Value
        type: string
  link_list:
    type: object
    label: Links
    list: true
    fields:
      - name: label
        label: Label
        type: string
        required: true
      - name: url
        label: URL
        type: string
        required: true
      - name: target_blank
        label: Open in new tab
        type: boolean
        default: false
      - name: enabled
        label: Visible
        type: boolean
        default: true
content:
  - name: tours
    label: Tours
    type: collection
    path: src/content/tours
    filename:
      template: "{slug}.md"
      field: create
    operations:
      create: true
      rename: true
      delete: true
    view:
      primary: title
      fields:
        - title
        - published
        - featured
        - fixed_departure
        - duration
        - price_from
        - destination
    fields:
      - name: _h_the_basics
        label: The basics
        type: heading
      - name: title
        label: Title
        type: string
        required: true
      - name: permalink
        hidden: true
        label: URL path
        type: string
        required: true
        description: "Example: /tours/your-slug/"
      - name: layout
        label: Layout
        type: string
        default: layouts/journey.njk
        hidden: true
      - name: service_type
        label: Service type
        type: string
        default: tours
        hidden: true
      - name: service_label
        label: Service label
        type: string
        default: Tours
        hidden: true
      - name: _h_show_it_on_the_website
        label: Show it on the website
        type: heading
      - name: published
        label: Published
        type: boolean
        default: true
      - name: featured
        label: Featured
        type: boolean
        default: false
      - name: best_seller
        label: Best seller
        type: boolean
        default: false
      - name: fixed_departure
        label: Fixed departure
        type: boolean
        default: false
      - name: trip_status
        label: Availability/status
        type: select
        options:
          - Available
          - Limited places
          - On request
          - Sold out
          - Draft
      - name: _h_short_descriptions
        label: Short descriptions
        type: heading
      - name: summary
        description: Do ya teen line - yeh cards par aur Google par nazar aati hai.
        label: Short description
        type: text
        required: true
      - name: _h_photos
        label: Photos
        type: heading
      - name: cover_image
        label: Cover image
        type: image
      - name: gallery
        description: >-
          Is page ki photo gallery. Upload karein ya library se chunein; pehli
          photo pehle dikhti hai.
        label: Gallery images
        type: image
        list: true
      - name: _h_duration_price_group_size
        label: Duration, price & group size
        type: heading
      - name: duration
        label: Duration
        type: string
      - name: price_from
        label: Price from
        type: string
      - name: deposit
        label: Deposit
        type: string
      - name: group_size
        label: Group size
        type: string
      - name: difficulty
        label: Difficulty
        type: select
        options:
          - Easy
          - Moderate
          - Challenging
          - Strenuous
          - Expedition
      - name: _h_destination
        label: Destination
        type: heading
      - name: destination
        label: Destination
        type: string
      - name: _h_categories_tags
        label: Categories & tags
        type: heading
        collapsed: true
      - name: categories
        description: >-
          Group banane ke liye - jaise "Cultural", "Family". Menu aur filters
          inhi se bante hain.
        label: Categories
        type: string
        list: true
      - name: tags
        description: >-
          Sirf search aur andar ke kaam ke liye - website par visitor ko nazar
          nahi aate.
        label: Tags
        type: string
        list: true
      - name: _h_departure_dates
        label: Departure dates
        type: heading
        collapsed: true
      - name: departures
        label: Departure dates
        type: date
        list: true
      - name: departure_details
        description: >-
          Sirf tab bharein jab fixed dates par group ja raha ho. Warna khali
          chhor dein.
        label: Detailed departure rows
        type: object
        list: true
        fields:
          - name: dates
            label: Dates
            type: string
          - name: status
            label: Status
            type: string
          - name: places
            label: Places
            type: string
          - name: deposit
            label: Deposit
            type: string
          - name: price
            label: Full price
            type: string
          - name: note
            label: Note
            type: text
      - name: _h_highlights_inclusions_packin
        label: Highlights, inclusions & packing
        type: heading
      - name: highlights
        description: Chaar se chh chhoti lines - safar ki sab se khaas baatein.
        label: Highlights
        type: string
        list: true
      - name: included
        description: Qeemat mein kya shamil hai, ek line fi cheez.
        label: Included
        type: string
        list: true
      - name: excluded
        description: Qeemat mein kya shamil nahi, ek line fi cheez.
        label: Excluded
        type: string
        list: true
      - name: packing_list
        label: Packing list
        type: string
        list: true
      - name: _h_extras_route_map_trip_leader
        label: Extras — route map & trip leader
        type: heading
        collapsed: true
      - name: route_map_url
        label: Route map URL
        type: string
      - name: trip_leader
        label: Trip leader
        type: object
        fields:
          - name: name
            label: Name
            type: string
          - name: role
            label: Role
            type: string
          - name: image
            label: Photo
            type: image
          - name: bio
            label: Biography
            type: text
      - name: _h_questions_key_facts_helps_go
        label: Questions & key facts (helps Google and AI)
        type: heading
      - name: faqs
        label: FAQs
        type: object
        list: true
        fields:
          - name: question
            label: Question
            type: string
            required: true
          - name: answer
            label: Answer
            type: rich-text
            required: true
      - name: _h_filled_in_automatically_open
        label: Filled in automatically — open only to change something
        type: heading
        collapsed: true
      - name: slug
        description: >-
          Page ka address ka aakhri hissa, chhote haroof aur dash mein - jaise
          k2-base-camp-trek. Badalne se purana link toot sakta hai.
        label: Slug
        type: string
        required: true
        pattern:
          regex: ^[a-z0-9-]+$
          message: Use lowercase letters, numbers and hyphens only.
      - name: departure_type
        label: Departure type
        type: select
        options:
          - Private
          - Fixed Departure
          - Group Departure
          - Custom
      - name: answer_summary
        description: >-
          Ek saaf jumla jo bataye yeh safar kya hai. ChatGPT aur Google ke AI
          jawab isi ko uthate hain.
        label: Quick answer (AEO/GEO)
        type: text
      - name: cover_image_alt
        description: >-
          Photo mein kya nazar aa raha hai, ek chhoti line mein. Google Images
          aur nabina logon ke liye.
        label: Cover image alt text
        type: string
      - name: duration_days
        label: Duration in days
        type: number
        options:
          min: 1
          max: 365
      - name: price_currency
        label: Currency
        type: select
        options:
          - USD
          - PKR
          - EUR
          - GBP
      - name: reviews
        description: >-
          Yahan haath se review likhne ki zarurat nahi. Mehmanon ki reviews
          dashboard ke "Reviews" wale hisse se publish hoti hain.
        label: Guest reviews
        type: object
        list: true
        fields:
          - name: name
            label: Guest name
            type: string
          - name: country
            label: Country
            type: string
          - name: rating
            label: Rating
            type: number
            options:
              min: 1
              max: 5
              step: 0.1
          - name: quote
            label: Review
            type: text
          - name: date
            label: Date
            type: date
      - name: key_facts
        description: >-
          Chhoti label aur value - jaise "Best season: May-September". AI inhi
          ko seedha quote karta hai.
        label: Key facts
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
          - name: value
            label: Value
            type: string
      - name: author
        description: >-
          Yeh page kis ne tayar kiya. Khali chhor dein to business ka naam chala
          jata hai.
        label: Prepared by
        type: string
      - name: reviewed_by
        description: >-
          Kis ne check kiya. Google aur AI aise pages ko zyada ahmiyat dete
          hain.
        label: Reviewed by
        type: string
      - name: last_verified
        description: Aakhri baar kab check kiya tha. Saal mein ek do baar update kar dein.
        label: Last verified
        type: date
      - name: sources
        description: Hawale - sirf tab jab kisi sarkari safhe ya khabar ka hawala dena ho.
        label: Sources
        type: object
        list: true
        fields:
          - name: label
            label: Source label
            type: string
          - name: url
            label: Source URL
            type: string
      - name: _h_search_social_sharing
        label: Search & social sharing
        type: heading
      - name: seo
        label: SEO, GEO, AEO & Social
        type: object
        fields:
          - name: title
            label: SEO title
            type: string
          - name: description
            label: Meta description
            type: text
          - name: keywords
            label: Keywords
            type: string
          - name: robots
            label: Robots
            type: string
            description: "Example: index, follow, max-image-preview:large"
          - name: canonical
            label: Custom canonical
            type: string
          - name: social_image
            label: Social/OG image
            type: image
      - name: _h_full_content_itinerary
        label: Full content / itinerary
        type: heading
      - name: body
        label: Full content / itinerary
        type: rich-text
