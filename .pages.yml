  - name: page_control
    label: "Pages: show or hide"
    type: file
    path: src/_data/pageControl.json
    operations:
      delete: false
      rename: false
    fields:
      - name: pages
        label: Website pages
        type: object
        list: true
        description: >-
          Website ke sare pages. Kisi page ko website se hatana ho to us ka
          switch band kar dein - page CMS mein mojood rahega lekin website par
          bilkul nahi aayega. Yeh fehrist khud banti hai; naya page banay to woh
          apne aap yahan aa jata hai.
        fields:
          - name: label
            label: Page
            type: string
          - name: url
            label: Address
            type: string
          - name: published
            label: Show on website
            type: boolean
            default: true
          - name: redirect_to
            label: If hidden, send visitors to
            type: string
            description: >-
              Khali chhor dein to page bas gayab ho jata hai - naye ya adhoore
              pages ke liye yahi theek hai. Lekin agar is page ka pata Google
              mein ya kisi aur website par maujood hai, to yahan us page ka
              address likh dein jahan log jana chahiye - jaise /tours/. Is se
              aane wala khali hath nahi lautta aur Google is page ki kamai nayi
              jagah ko de deta hai.
          - name: file
            label: File
            type: string
            hidden: true
      - name: hidden
        label: Hidden pages (automatic)
        type: string
        list: true
        hidden: true
      - name: redirects
        label: Redirects (automatic)
        type: object
        list: true
        hidden: true
        fields:
          - name: from
            label: From
            type: string
          - name: to
            label: To
            type: string
  - name: landing
    label: Menu Pages
    type: collection
    path: content/landing
    filename:
      template: "{slug}.md"
      field: create
    operations:
      create: false
      rename: false
      delete: false
    view:
      primary: title
      fields:
        - title
        - url
    fields:
      - name: _h_page
        label: Page basics
        type: heading
        description: >-
          These are the pages themselves — their heading, intro text and link
          cards. The tours, treks and articles that appear on them are edited in
          their own cards (Tours, Trekking, Travel Guides & News, and so on).
      - name: title
        label: Page title
        type: string
        required: true
      - name: summary
        label: Short description
        type: text
        description: Two lines - shown in the banner and on Google.
      - name: hero_eyebrow
        label: Small line above the title
        type: string
      - name: _h_section
        label: Section heading
        type: heading
      - name: section_eyebrow
        label: Small line above
        type: string
      - name: section_heading
        label: Heading
        type: string
      - name: section_intro
        label: Intro text
        type: text
      - name: _h_cards
        label: Cards on this page
        type: heading
      - name: cards
        label: Cards
        type: object
        list: true
        description: Click a row to edit it. Add, remove or reorder as you like.
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: description
            label: Description
            type: text
          - name: url
            label: Link
            type: string
          - name: enabled
            label: Visible
            type: boolean
            default: true
      - name: _h_google
        label: Search engines
        type: heading
        collapsed: true
      - name: seo_title
        label: SEO title
        type: string
      - name: seo_description
        label: Meta description
        type: text
      - name: url
        label: Page URL
        type: string
        hidden: true
    description: >-
      These are the pages themselves — their heading, intro text and link cards.
      The tours, treks and articles that appear on them are edited in their own
      cards (Tours, Trekking, Travel Guides & News, and so on).
  - name: clients
    label: Happy Clients (homepage)
    description: >-
      The travellers you want on the homepage, with their photo and a line about
      their trip. These are yours to choose — guest reviews that people send in
      are handled separately under Reviews.
    type: collection
    path: content/clients
    filename:
      template: "{name}.md"
      field: name
    view:
      primary: name
      fields:
        - name
        - country
        - published
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: photo
        label: Photo
        type: image
        description: A square photo works best — it is shown in a circle.
      - name: country
        label: Country
        type: string
      - name: quote
        label: What they said
        type: text
        required: true
      - name: order
        label: Order
        type: number
        description: Lower numbers come first.
      - name: published
        label: Show on the website
        type: boolean
        default: true
  - name: partners
    label: Our Partners (homepage)
    description: >-
      Partner and affiliate logos, shown just above the footer. Each logo opens
      that partner's own website.
    type: collection
    path: content/partners
    filename:
      template: "{name}.md"
      field: name
    view:
      primary: name
      fields:
        - name
        - url
        - published
    fields:
      - name: name
        label: Partner name
        type: string
        required: true
      - name: logo
        label: Logo
        type: image
        required: true
        description: PNG or SVG with a see-through background looks best.
      - name: url
        label: Their website
        type: string
        description: Opens in a new tab. Leave empty for a logo with no link.
      - name: order
        label: Order
        type: number
        description: Lower numbers come first.
      - name: published
        label: Show on the website
        type: boolean
        default: true
  - name: announcements
    label: Announcement Bar (top of every page)
    description: >-
      A thin strip at the very top of the site. With more than one message they
      take turns. A reader can close it; it comes back when you change the
      wording.
    type: collection
    path: content/announcements
    filename:
      template: "{year}-{month}-{day}-{hour}{minute}.md"
      field: message
    view:
      primary: message
      fields:
        - message
        - published
    fields:
      - name: message
        label: Message
        type: text
        required: true
        description: Keep it to one line — it sits above everything else.
      - name: link_url
        label: Link
        type: string
        description: Optional. Where the message leads.
      - name: link_label
        label: Link wording
        type: string
        description: Leave empty for "Find out more".
      - name: order
        label: Order
        type: number
        description: Lower numbers come first.
      - name: published
        label: Show on the website
        type: boolean
        default: true
